function drawUnitFrame(c, type, team, anim, ph) {

  c.fillStyle = body; rr(c, -4.5, -18 - bob, 9, 11, 3); c.fill();
  if (type === 'vil') { c.fillStyle = TEAMC[team]; c.fillRect(-4.5, -12 - bob, 9, 2.5); }
  else if (type === 'monk') { c.fillStyle = TEAMC[team]; c.fillRect(-4.5, -13 - bob, 9, 2); }
  else if (type === 'samurai') { c.fillStyle = TEAMC[team]; for (let i = 0; i < 3; i++) c.fillRect(-4.5, -17 + i * 3.2 - bob, 9, 1.6); }
  else { c.fillStyle = TEAMD[team]; c.fillRect(-4.5, -18 - bob, 9, 3); }
  if (type === 'monk') { c.fillStyle = '#ece6d6'; c.beginPath(); c.arc(.5, -22 - bob, 4.4, 0, 7); c.fill(); c.fillStyle = '#f0c9a0'; c.beginPath(); c.arc(2, -21.5 - bob, 2.4, 0, 7); c.fill(); }
  else { c.fillStyle = '#f0c9a0'; c.beginPath(); c.arc(.5, -21.5 - bob, 3.6, 0, 7); c.fill(); }
  if (type === 'vil') { c.fillStyle = '#d9bb6c'; c.beginPath(); c.moveTo(-7, -22 - bob); c.lineTo(7.5, -22 - bob); c.lineTo(.5, -28 - bob); c.closePath(); c.fill(); }
  else if (type === 'spear') { c.fillStyle = TEAMD[team]; c.beginPath(); c.moveTo(-5.5, -22.5 - bob); c.lineTo(6.5, -22.5 - bob); c.lineTo(.5, -27.5 - bob); c.closePath(); c.fill(); }
  else if (type === 'samurai') { c.fillStyle = '#22212a'; c.beginPath(); c.arc(.5, -22.5 - bob, 4.3, Math.PI, 0); c.fill(); c.fillRect(-4.6, -23 - bob, 2.6, 4.5);
    c.strokeStyle = '#f2c84b'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-2.5, -30.5 - bob); c.lineTo(.5, -26 - bob); c.lineTo(3.5, -30.5 - bob); c.stroke(); }
